site_name: pe-mixer
site_url: https://pedrums.github.io/pe-mixer/
theme:
  name: material
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

nav:
  - Home: index.md
  - Installation & Schnellstart: getting-started.md
  - Setups & Konfiguration: setups.md
  - DSP-Kette & Mixing-Engine: mixing.md
  - CLI-Referenz: cli.md
  - API Reference: api.md
